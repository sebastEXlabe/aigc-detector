name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ matrix.python-version }}

      - name: Install lightweight test deps
        run: |
          pip install --upgrade pip
          pip install numpy scikit-learn jieba beautifulsoup4 python-docx

      - name: Run smoke tests
        run: |
          python tests/test_smoke.py

      - name: Syntax check all python files
        run: |
          python -c "
          import ast, pathlib, sys
          bad = []
          for p in pathlib.Path('.').rglob('*.py'):
              try:
                  ast.parse(p.read_text(encoding='utf-8'))
              except SyntaxError as e:
                  bad.append(str(p))
          if bad:
              print('语法错误:', bad); sys.exit(1)
          else:
              print('所有 python 文件语法正确')
          "
