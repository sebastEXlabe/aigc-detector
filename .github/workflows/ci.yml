name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-3.12

      - name: Install torch (CPU) + deps + test libs
        run: |
          pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install transformers numpy scikit-learn jieba beautifulsoup4 python-docx fastapi uvicorn httpx pytest requests

      - name: Run full CI test suite
        run: |
          python -m pytest tests/ -v

      - name: Syntax check all python files
        run: |
          python - <<'PYEOF'
          import ast, pathlib, sys
          bad = []
          for p in pathlib.Path('.').rglob('*.py'):
              try:
                  ast.parse(p.read_text(encoding='utf-8'))
              except SyntaxError:
                  bad.append(str(p))
          if bad:
              print('语法错误:', bad); sys.exit(1)
          print('所有 python 文件语法正确')
          PYEOF
